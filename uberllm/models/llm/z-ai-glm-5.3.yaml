model: z-ai/glm-5.3
label:
  en_US: "GLM 5.3"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - agent-thought
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 1
    min: 0
    max: 2
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 131072
  - name: response_format
    label:
      en_US: Reply format
    type: string
    help:
      en_US: Choose json_object to always get JSON back, or json_schema to get JSON that follows your schema.
    required: false
    options:
      - text
      - json_object
