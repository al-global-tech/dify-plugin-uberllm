model: anthropic/claude-sonnet-5.5
label:
  en_US: "Claude Sonnet 5.5"
model_type: llm
features:
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - agent-thought
  - vision
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    default: 1
    min: 0
    max: 1
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 128000
  - name: response_format
    label:
      en_US: Reply format
    type: string
    help:
      en_US: Choose json_object to always get JSON back, or json_schema to get JSON that follows your schema.
    required: false
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
